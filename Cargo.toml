[workspace]
resolver = "3"
members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nisarsyed/openconv"
# Floor implied by edition 2024. Not currently verified by CI, so treat it as
# a statement of intent rather than a tested guarantee.
rust-version = "1.85"

# Inherited by every member with `lints.workspace = true`.
#
# The `rust` set follows tokio's: it catches undocumented public API, types
# that cannot be printed in a debugger, and accidental public reachability.
# `unsafe_code` is forbidden outright — nothing here needs it, and the FFI
# layer is generated by UniFFI rather than hand-written.
[workspace.lints.rust]
# `deny`, not `forbid`. Unsafe is a tool, and being categorically unable to
# reach for it is its own kind of cost — FFI, SIMD and some zero-copy work
# genuinely need it. `forbid` cannot be overridden anywhere, ever; `deny`
# means a specific block can opt in with a written justification and stays
# visible in review.
#
# The price of opting in is the three lints below: a SAFETY comment on every
# unsafe block, one operation per block so the comment is specific, and no
# implicit unsafe inside an unsafe fn. Reach for it when it is measured, not
# when it is assumed.
unsafe_code = "deny"
# An `unsafe fn` body is not automatically an unsafe block. Borrowed from tokio.
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

# `pedantic` at a lower priority so the specific entries below can override it.
# The allowances are the lints whose cost here exceeds their value, each with
# a reason; everything else in pedantic is expected to be fixed, not silenced.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A relay and a crypto core have no business writing to stdout; logging goes
# through `tracing`. Borrowed from axum.
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
# `store::Store`-style names read better than the alternatives.
module_name_repetitions = "allow"
# These two are what make "monitored" mean something. Both are in clippy's
# `restriction` group, so pedantic does not enable them.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
