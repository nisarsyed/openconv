name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here needs to write to the repository, and a
# workflow that cannot write cannot be turned into one that does by a change
# to a file it builds.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster caches: debug info is not useful on a runner.
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version and the components, so there is
      # nothing to choose here. This step just makes the install an explicit,
      # readable failure rather than a surprise inside the first cargo call.
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      # Cheapest check first: no compilation, so a formatting slip fails in
      # seconds rather than after the dependency tree has been built.
      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Keychain test is #[ignore]d and stays that way: it needs macOS and
      # a real Keychain. The Swift half of the suite runs in its own workflow.
      - name: Test
        run: cargo test --workspace

  # Separate job: it needs no Rust build, so it runs in parallel with the one
  # above rather than waiting behind a compile.
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The action ships a prebuilt binary. `cargo install cargo-deny` takes
      # minutes and would dominate this job's runtime.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  swift:
    name: Swift
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          swift --version
          xcode-select -p

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Bindings are generated, not committed. Building without this step
      # would compile against whatever happened to be on disk — which on a
      # fresh runner is nothing.
      - name: Generate bindings
        run: ./scripts/gen-bindings.sh

      - name: Build client
        working-directory: clients/macos
        run: swift build

      # Runtime verification of the FFI. A plain executable rather than a test
      # target, because XCTest and swift-testing both need a full Xcode and
      # this build deliberately targets Command Line Tools only.
      - name: Bridge check
        working-directory: clients/macos
        run: swift run BridgeCheck

      # Generated bindings are excluded on purpose; only hand-written sources.
      - name: Format lint
        working-directory: clients/macos
        run: swift format lint --strict --recursive Sources/OpenConv Sources/BridgeCheck

  # The three-client end-to-end test: a real relay and three real SwiftUI
  # clients, which is what caught the dropped commit and the forked group that
  # every unit test missed.
  #
  # It does run on a hosted runner — the apps launch without a desktop session.
  # It waits on conditions rather than sleeping, so it is fast and does not get
  # less reliable as the runner gets busier.
  smoke:
    name: Smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run smoke test
        run: ./scripts/smoke.sh
