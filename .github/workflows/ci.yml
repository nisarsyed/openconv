name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. Nothing here needs to write to the repository, and a
# workflow that cannot write cannot be turned into one that does by a change
# to a file it builds.
permissions:
  contents: read

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Smaller, faster caches: debug info is not useful on a runner.
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version and the components, so there is
      # nothing to choose here. This step just makes the install an explicit,
      # readable failure rather than a surprise inside the first cargo call.
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo clippy --version
          cargo fmt --version

      - uses: Swatinem/rust-cache@v2

      # Cheapest check first: no compilation, so a formatting slip fails in
      # seconds rather than after the dependency tree has been built.
      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Keychain test is #[ignore]d and stays that way: it needs macOS and
      # a real Keychain. The Swift half of the suite runs in its own workflow.
      - name: Test
        run: cargo test --workspace

  # Separate job: it needs no Rust build, so it runs in parallel with the one
  # above rather than waiting behind a compile.
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cargo-deny's own action is a Docker action and spends ~13s building
      # the image before it does any work — longer than compiling and testing
      # the whole workspace. This fetches a prebuilt binary instead.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - run: cargo deny check

  # Swift and the smoke test share everything expensive — bindings, the Rust
  # staticlib, the Swift build — so they are one job. Run separately they each
  # paid for a full build, on two macOS runners, to reach the same state.
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          swift --version
          xcode-select -p

      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # SwiftPM keeps its artifacts in .build and nothing else caches them, so
      # without this every run pays a cold Swift build. Cold is ~32s against
      # ~2s warm, and it was being paid twice.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: clients/macos/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('clients/macos/Package.swift', 'clients/macos/Sources/**/*.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      # Bindings are generated, not committed; a fresh runner has nothing to
      # build against.
      - name: Generate bindings
        run: ./scripts/gen-bindings.sh

      - name: Build client
        working-directory: clients/macos
        run: swift build

      # Runtime verification of the FFI. A plain executable rather than a test
      # target, because XCTest and swift-testing both need a full Xcode and
      # this build deliberately targets Command Line Tools only.
      - name: Bridge check
        working-directory: clients/macos
        run: swift run BridgeCheck

      # Generated bindings are excluded on purpose; only hand-written sources.
      - name: Format lint
        working-directory: clients/macos
        run: swift format lint --strict --recursive Sources/OpenConv Sources/BridgeCheck

      # Three real clients through a real relay — the test that caught the
      # dropped commit and the forked group. Reuses the build above rather
      # than repeating it.
      - name: Smoke test
        run: ./scripts/smoke.sh
