[package]
name = "openconv-core"
version.workspace = true
edition.workspace = true
description = "MLS group state, message encryption, and the UniFFI surface for clients"
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
openmls_basic_credential = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uniffi = "0.32"
openconv-wire = { path = "../wire" }
rand = "0.8"
# The MLS store, in SQLite. Patched to the vendored copy in the workspace
# manifest until upstream releases it on rusqlite 0.40.
openmls_sqlite_storage = "0.3"
# SQLCipher, so the whole database is encrypted at rest. On macOS it uses
# CommonCrypto from the Security framework; elsewhere, the system OpenSSL.
# 0.40 to match the relay: libsqlite3-sys allows one version per build.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
security-framework = "3"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]
