[package]
name = "openconv-server"
version.workspace = true
edition.workspace = true
description = "Blind WebSocket relay: routes opaque frames by address without parsing them"
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = "0.3"
openconv-wire = { path = "../wire" }
# 0.40, not the latest: `libsqlite3-sys` allows one version per build graph,
# and 0.40 is what the core moves to in #107. Bundled so the relay does not
# depend on whichever SQLite the host happens to ship.
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = { workspace = true }

[dev-dependencies]
openconv-core = { path = "../core" }
tokio-tungstenite = "0.30"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tokio = { workspace = true }
tempfile = "3"
